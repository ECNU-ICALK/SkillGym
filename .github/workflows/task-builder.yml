name: Task builder checks

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/paper-homepage-and-directory-names

permissions:
  contents: read

concurrency:
  group: task-builder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: task_builder/package-lock.json
      - name: Check renamed paths and README links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          root = Path.cwd()
          pattern = re.compile(r'''(?<![A-Za-z_])(?:SkillLibrary|TaskTemplates|TaskBuilder)(?=[/"'`\\]|$)''')
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          failures = []
          for name in tracked:
              owned = name in {"README.md", ".gitignore"} or name.startswith(("task_builder/src/", "task_builder/tests/", "docs/"))
              if not owned or name == "docs/migration.md":
                  continue
              text = (root / name).read_text(encoding="utf-8")
              for number, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      failures.append(f"{name}:{number}: obsolete directory reference: {line}")
          readme = (root / "README.md").read_text()
          for target in re.findall(r'!?\[[^\]]*\]\(([^)]+)\)', readme):
              if target.startswith(("https://", "http://", "#", "mailto:")):
                  continue
              relative = target.split("#", 1)[0]
              if not (root / relative).exists():
                  failures.append(f"README.md: missing relative link: {target}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("Project-owned paths and README relative links verified.")
          for prefix in ("skill_library/", "task_templates/"):
              hits = []
              for name in tracked:
                  if not name.startswith(prefix):
                      continue
                  try:
                      text = (root / name).read_text(encoding="utf-8")
                  except (UnicodeError, OSError):
                      continue
                  if pattern.search(text):
                      hits.append(name)
              print(f"Retained upstream path-reference audit: {prefix}: {len(hits)} files")
              for name in hits:
                  print(name)
          PY
      - name: Install locked dependencies
        run: npm --prefix task_builder ci
      - name: Type check
        run: npm --prefix task_builder run check
      - name: Run builder tests
        working-directory: task_builder
        run: |
          for test_file in tests/*.test.ts; do
            echo "::group::$test_file"
            node --import tsx "$test_file"
            echo "::endgroup::"
          done