apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: saturn-checkout
spec:
  replicas: 3
  strategy:
    canary:
      stableService: saturn-checkout-stable
      canaryService: saturn-checkout-canary
      analysis:
        templates:
          - templateName: saturn-success-rate
      steps:
        - setWeight: 25
        - pause:
            duration: 5m
