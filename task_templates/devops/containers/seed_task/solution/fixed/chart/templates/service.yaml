apiVersion: v1
kind: Service
metadata:
  name: {{ include "podpulse.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "podpulse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "podpulse.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
