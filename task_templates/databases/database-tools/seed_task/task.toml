version = "1.0"

[metadata]
id = "database-tools__rapid-transit-schema-release"
name = "Rapid Transit Schema Release"
description = "Build a PostgreSQL schedule-release warehouse from a GTFS snapshot, then deliver a zero-filled station window panel, a terminal service-gap leaderboard, and reusable migration SQL."
difficulty = "hard"
category = "database-tools"
tags = [
  "database-tools",
  "postgresql",
  "sql",
  "migrations",
  "gtfs",
  "transport-analytics",
  "calendar-exceptions",
  "station-rollup",
]
required_skills = ["database-migrations"]
primary_output_file = "/root/output/terminal_service_gap_leaderboard.tsv"
source_template_id = "database-tools__rapid-transit-schema-release"
task_role = "template"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
