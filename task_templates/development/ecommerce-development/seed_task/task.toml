version = "1.0"

[metadata]
id = "ecommerce_development__museum_printshop_launch"
name = "Template: Museum Printshop Launch"
description = "Build a WooCommerce print store workspace from museum source data, including catalog seeding, shipping rules, payment restrictions, and a launch feed endpoint."
difficulty = "hard"
category = "ecommerce-development"
tags = [
  "wordpress",
  "woocommerce",
  "php",
  "wp-cli",
  "catalog-seeding",
  "shipping",
  "payments",
  "rest-api",
]
required_skills = [
  "wordpress-woocommerce-development",
]
primary_output_file = "/app/workspace/output/seed-summary.json"
source_template_id = "ecommerce_development__museum_printshop_launch"
task_role = "template"

[verifier]
timeout_sec = 1200.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = true
