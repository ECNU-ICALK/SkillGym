version = "1.0"

[metadata]
id = "scientific-computing__marine-heat-intake-screening"
name = "Marine Heat Intake Screening"
description = "Discover the matching buoy, metadata, and OISST candidate files from local directories, then prepare an intake package and shortlist warming windows from the selected inputs and the screening contract."
difficulty = "hard"
category = "scientific-computing"
tags = [
  "scientific-computing",
  "netcdf",
  "xml",
  "oceanography",
  "data-intake",
  "environmental-data",
  "quality-screening",
]
required_skills = ["exploratory-data-analysis"]
primary_output_file = "/root/output/candidate_windows.csv"
source_template_id = "scientific-computing__marine-heat-intake-screening"
