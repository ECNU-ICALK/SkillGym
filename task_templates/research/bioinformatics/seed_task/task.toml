difficulty = "hard"
category = "bioinformatics"
tags = [
  "bioinformatics",
  "single-cell-rna-seq",
  "scanpy",
  "10x-genomics",
  "quality-control",
  "clustering",
  "marker-genes",
  "cell-type-annotation",
]
required_skills = ["scanpy"]
