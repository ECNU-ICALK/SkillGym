version = "1.0"

[metadata]
id = "computational-chemistry__aqsol-release-refresh"
name = "AqSol Release Refresh"
description = "Build a current aqueous-solubility release package from public-data-shaped splits, a local experiment workspace, and release-governance rules."
difficulty = "hard"
category = "computational-chemistry"
tags = [
  "computational-chemistry",
  "molecular-property-prediction",
  "solubility",
  "model-selection",
  "smiles",
  "release-audit",
]
required_skills = ["cli-anything-unimol-tools"]
primary_output_file = "/root/workspace/output/selected_model.json"
source_template_id = "research/computational-chemistry/template_new"
