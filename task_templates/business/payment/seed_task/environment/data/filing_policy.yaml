path_template: "organized/{expense_category}/{vendor_slug}/{filename}"
filename_template: "{invoice_date} {vendor_name_canonical} - {document_type} - {reference_sanitized}{ext}"
reference_fallback: "NOREF"
invoice_date_fallback: "UNDATED"
duplicate_keep_rule: "Within documents sharing canonical vendor, invoice number, currency, and total amount, keep the lexicographically smallest source_file eligible and mark the rest duplicate_document."
reference_sanitization:
  uppercase: true
  replace_non_alnum_with_dash: true
  collapse_repeated_dashes: true
vendor_slug_rule:
  lowercase: true
  replace_non_alnum_with_dash: true
  collapse_repeated_dashes: true
manual_review_notes:
  required: true
