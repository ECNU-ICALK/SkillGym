version = "1.0"

[metadata]
id = "code-quality__toolchain-release-readiness-audit"
name = "Template: Toolchain Release Readiness Audit"
description = "Audit a local TypeScript package that consolidates npm and GitHub release snapshots, then produce a formal release-readiness report from the repository's own verification path."
difficulty = "hard"
category = "code-quality"
tags = [
  "code-quality",
  "verification",
  "release-audit",
  "typescript",
  "git",
  "npm",
  "public-data",
]
required_skills = [
  "verification-loop",
]
distractor_skills = [
  "dependency-updates",
  "json-transforms",
  "package-publishing",
]
task_role = "template"
primary_output_file = "/app/output/release_readiness_report.json"

[agent]
timeout_sec = 600.0

[solution]
timeout_sec = 600.0

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
