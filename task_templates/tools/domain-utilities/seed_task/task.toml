version = "1.0"

[metadata]
id = "domain-utilities__developer-workflow-domain-shortlist"
name = "Template: Developer Workflow Domain Shortlist"
description = "Prepare a ranked domain shortlist from a public-source-inspired naming packet, a recorded availability snapshot, and deterministic business rules."
difficulty = "hard"
category = "domain-utilities"
tags = [
  "domain-utilities",
  "domain-naming",
  "availability-audit",
  "public-datasets",
  "ranking",
  "json",
  "csv",
]
required_skills = [
  "domain-name-brainstormer",
]
distractor_skills = [
  "brand-designer",
  "web-scraping",
  "market-research",
]
primary_output_file = "/root/output/domain_shortlist.json"
source_template_id = "domain-utilities__developer-workflow-domain-shortlist"
task_role = "template"

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
