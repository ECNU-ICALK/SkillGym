namespace: observability-prod
environment: prod

replicaCount: 3

serviceAccount:
  create: true
  annotations: {}

config:
  LOG_FORMAT: json
  CACHE_STRATEGY: memory
  FEATURE_BANNER: enabled
  LOG_LEVEL: info

secretEnv:
  - name: API_TOKEN
    secretName: podpulse-prod-runtime
    key: apiToken

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: podpulse.example.com
  path: /
  pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2
