namespace: observability-staging
environment: staging

replicaCount: 2

serviceAccount:
  create: true
  annotations: {}

config:
  LOG_FORMAT: json
  CACHE_STRATEGY: memory
  FEATURE_BANNER: enabled
  LOG_LEVEL: debug

secretEnv:
  - name: API_TOKEN
    secretName: podpulse-staging-runtime
    key: apiToken

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: podpulse-staging.internal.example.com
  path: /
  pathType: Prefix

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 1
