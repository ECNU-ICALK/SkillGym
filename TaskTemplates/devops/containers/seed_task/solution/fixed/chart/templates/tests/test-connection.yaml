apiVersion: v1
kind: Pod
metadata:
  name: {{ include "podpulse.fullname" . }}-test-connection
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "podpulse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - sh
        - -c
        - wget -qO- http://{{ include "podpulse.fullname" . }}:{{ .Values.service.port }}/healthz
