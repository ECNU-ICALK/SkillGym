version = "1.0"

[metadata]
id = "scripting__airport-report-pipeline"
name = "Template: Airport Report Pipeline Repair"
description = "Repair a shell-based airport reporting pipeline that rebuilds country and region reports from a real OurAirports data snapshot."
difficulty = "hard"
category = "scripting"
tags = [
  "scripting",
  "bash",
  "shell-pipeline",
  "reporting",
  "ourairports",
  "tsv",
  "defensive-bash"
]
required_skills = ["bash-defensive-patterns"]
primary_output_file = "/app/output/country_airport_summary.csv"
source_template_id = "scripting__airport-report-pipeline"
task_role = "template"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
