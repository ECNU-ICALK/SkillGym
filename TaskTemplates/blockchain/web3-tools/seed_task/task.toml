version = "1.0"

[metadata]
id = "web3-tools__cross-exchange-daily-surveillance"
name = "Template: Cross-Exchange Daily Surveillance"
description = "Prepare a contract-driven daily surveillance delivery from paginated exchange catalogs and public crypto OHLCV payloads."
difficulty = "hard"
category = "web3-tools"
tags = [
  "web3-tools",
  "ccxt",
  "python",
  "crypto",
  "exchange-data",
  "ohlcv",
  "market-catalog",
  "symbol-normalization",
  "cross-exchange",
]
required_skills = ["ccxt-python"]
primary_output_file = "/app/output/surveillance/market_report.json"
source_template_id = "web3-tools__cross-exchange-daily-surveillance"
