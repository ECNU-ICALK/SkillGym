version = "1.0"

[metadata]
id = "education__global_education_cohort_notebook"
name = "Template: Global Education Cohort Notebook"
description = "Build a rerunnable teaching notebook from a bundled education indicator packet and regenerate aligned lesson outputs."
difficulty = "hard"
category = "education"
tags = [
  "education",
  "jupyter-notebook",
  "data-analysis",
  "teaching-materials",
  "public-datasets",
  "csv-cleaning",
  "charting",
]
required_skills = [
  "jupyter-notebook",
]
distractor_skills = [
  "technical-writer",
  "data-analyst",
  "slide-designer",
]
primary_output_file = "/root/output/lesson_summary.json"
source_template_id = "education__global_education_cohort_notebook"
task_role = "template"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
