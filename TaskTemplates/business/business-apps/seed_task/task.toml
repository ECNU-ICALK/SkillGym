version = "1.0"

[metadata]
id = "business-apps__renewal-action-queue"
name = "Template: Renewal Action Queue Reconciliation"
description = "Build a renewal and collections action queue from older CRM and invoice snapshots plus a live in-container revops service."
difficulty = "hard"
category = "business-apps"
tags = [
  "business-apps",
  "billing-automation",
  "revenue-operations",
  "renewals",
  "collections",
  "cohort-review",
  "operations",
]
required_skills = [
  "billing-automation",
]
distractor_skills = [
  "sales-automator",
  "invoice-generator",
  "startup-metrics-framework",
]
primary_output_file = "/root/output/renewal_control_summary.json"
source_template_id = "business-apps__renewal-action-queue"
task_role = "template"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
