version = "1.0"

[metadata]
id = "project-management__supavisor-sprint-commitment"
name = "Template: Supavisor Sprint Commitment Planning"
description = "Build a two-week sprint commitment from a stale backlog export, role-based capacity inputs, policy constraints, and a live in-container planning service."
difficulty = "hard"
category = "project-management"
tags = [
  "project-management",
  "sprint-planning",
  "capacity-planning",
  "backlog-triage",
  "dependency-management",
  "release-planning",
  "operations",
]
required_skills = [
  "sprint-planner",
]
distractor_skills = [
  "meeting-notes",
  "issue-triage",
  "kanban-reporting",
]
primary_output_file = "/root/output/sprint_plan.json"
source_template_id = "project-management__supavisor-sprint-commitment"
task_role = "template"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
