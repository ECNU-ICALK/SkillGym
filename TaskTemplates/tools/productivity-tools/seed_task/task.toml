version = "1.0"

[metadata]
id = "productivity_tools__engineering_release_watch_digest"
name = "Template: Engineering Release Watch Digest"
description = "Complete a repeatable engineering release-watch digest from bundled public source mirrors, a tracked-source registry, and a local watch database with prior read history."
difficulty = "hard"
category = "productivity-tools"
tags = [
  "productivity-tools",
  "feed-monitoring",
  "rss",
  "atom",
  "stateful-workflow",
  "digest-generation",
]
required_skills = [
  "blogwatcher",
]
primary_output_file = "/app/output/engineering_release_digest.md"
source_template_id = "productivity_tools__engineering_release_watch_digest"
task_role = "template"

[verifier]
timeout_sec = 700.0

[agent]
timeout_sec = 700.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 16384
gpus = 0
allow_internet = true
