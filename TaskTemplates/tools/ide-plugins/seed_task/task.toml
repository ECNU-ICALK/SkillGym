version = "1.0"

[metadata]
id = "ide-plugins__vscode-release-briefing-localization"
name = "Template: VS Code Release Briefing Localization Delivery"
description = "Complete a VS Code extension that packages localized release briefings and a distributable VSIX from public VS Code update snapshots."
difficulty = "hard"
category = "ide-plugins"
tags = [
  "vscode",
  "extension-development",
  "localization",
  "vsix",
  "markdown",
  "ide-plugins"
]
required_skills = ["vscode-ext-localization"]
primary_output_file = "/app/workspace/output/release-briefing.zh-cn.md"
task_role = "template"

[agent]
timeout_sec = 1000.0

[solution]
timeout_sec = 1000.0

[verifier]
timeout_sec = 900.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
