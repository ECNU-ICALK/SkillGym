version = "1.0"

[metadata]
id = "security__tenant-vulnerability-advisory-api"
name = "Template: Tenant Vulnerability Advisory API"
description = "Build a tenant-scoped vulnerability advisory service with authenticated search, bulk lookup, export jobs, and tenant-bound CSV artifacts."
difficulty = "hard"
category = "security"
tags = [
  "security",
  "rest-api",
  "nodejs",
  "express",
  "authentication",
  "authorization",
  "pagination",
  "csv-export",
]
required_skills = [
  "security-review",
]
distractor_skills = [
  "api-design",
  "logging",
  "reporting",
]
task_role = "template"

[agent]
timeout_sec = 900.0

[solution]
timeout_sec = 900.0

[verifier]
timeout_sec = 900.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
